name: Analysis

on:
  workflow_call:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run lint and detekt
        run: |
          ./gradlew lint detektMain detektDebugUnitTest --stacktrace
        env:
          GoogleApiKey: ${{ secrets.PROD_GOOGLE_MAPS_API_KEY }}
      
      - uses: actions/upload-artifact@v4
        if: ${{ ! cancelled() }}
        with:
          name: detektAndLint
          path: app/build/reports/**/*
          if-no-files-found: error
