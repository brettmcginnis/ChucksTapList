				"$(BUILT_PRODUCTS_DIR)/kmm.framework",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Set environment variables\nexport PATH=\"/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH\"\n\n# Set JAVA_HOME - try multiple common locations\nif [ -d \"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" ]; then\n    export JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\"\nelif [ -d \"/opt/homebrew/Cellar/openjdk@17\" ]; then\n    export JAVA_HOME=\"/opt/homebrew/Cellar/openjdk@17/$(ls /opt/homebrew/Cellar/openjdk@17/ | head -1)/libexec/openjdk.jdk/Contents/Home\"\nelif [ -d \"/usr/local/Cellar/openjdk@17\" ]; then\n    export JAVA_HOME=\"/usr/local/Cellar/openjdk@17/$(ls /usr/local/Cellar/openjdk@17/ | head -1)/libexec/openjdk.jdk/Contents/Home\"\nelif [ -d \"/Library/Java/JavaVirtualMachines\" ]; then\n    export JAVA_HOME=\"$(ls -1 /Library/Java/JavaVirtualMachines/ | head -1)/Contents/Home\"\nelse\n    echo \"Warning: Could not find JAVA_HOME, trying system default\"\nfi\n\necho \"JAVA_HOME: $JAVA_HOME\"\necho \"PATH: $PATH\"\n\n# Change to project root\ncd \"$SRCROOT/..\"\necho \"Working directory: $PWD\"\n\n# Check if gradlew exists\nif [ ! -f \"./gradlew\" ]; then\n  echo \"Error: gradlew not found in $PWD\"\n  exit 1\nfi\n\n# Make gradlew executable\nchmod +x ./gradlew\n\n# Set Gradle memory options for this build\nexport GRADLE_OPTS=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\"\n\n# Determine build configuration and target architecture\nif [ \"$CONFIGURATION\" = \"Release\" ]; then\n    BUILD_TYPE=\"Release\"\n    FRAMEWORK_PATH=\"$PWD/kmm/build/XCFrameworks/release/kmm.xcframework\"\nelse\n    BUILD_TYPE=\"Debug\"\n    FRAMEWORK_PATH=\"$PWD/kmm/build/XCFrameworks/debug/kmm.xcframework\"\nfi\n\n# Build only the required targets to save memory\nif [[ \"$PLATFORM_NAME\" == \"iphonesimulator\" ]]; then\n    echo \"Building KMP framework for $BUILD_TYPE (Simulator targets only)...\"\n    GRADLE_TASK=\":kmm:link${BUILD_TYPE}FrameworkIosSimulatorArm64 :kmm:link${BUILD_TYPE}FrameworkIosX64 :kmm:assembleKmm${BUILD_TYPE}XCFramework\"\nelse\n    echo \"Building KMP framework for $BUILD_TYPE (Device target only)...\"\n    GRADLE_TASK=\":kmm:link${BUILD_TYPE}FrameworkIosArm64 :kmm:assembleKmm${BUILD_TYPE}XCFramework\"\nfi\n\n# Run gradle build with memory optimizations\n./gradlew $GRADLE_TASK --stacktrace --info --parallel --build-cache\n\n# Verify framework was built\nif [ ! -d \"$FRAMEWORK_PATH\" ]; then\n    echo \"Error: Framework not found at $FRAMEWORK_PATH\"\n    exit 1\nfi\n\necho \"Framework built successfully at: $FRAMEWORK_PATH\"\n\n# Extract the correct framework for the current architecture and copy to build directory\nif [[ \"$PLATFORM_NAME\" == \"iphonesimulator\" ]]; then\n    SOURCE_FRAMEWORK=\"$FRAMEWORK_PATH/ios-arm64_x86_64-simulator/kmm.framework\"\nelse\n    SOURCE_FRAMEWORK=\"$FRAMEWORK_PATH/ios-arm64/kmm.framework\"\nfi\n\nTARGET_FRAMEWORK=\"$BUILT_PRODUCTS_DIR/kmm.framework\"\n\necho \"Copying framework for $PLATFORM_NAME\"\necho \"Source: $SOURCE_FRAMEWORK\"\necho \"Target: $TARGET_FRAMEWORK\"\n\n# Copy the appropriate framework\nif [ -d \"$SOURCE_FRAMEWORK\" ]; then\n    rm -rf \"$TARGET_FRAMEWORK\"\n    cp -R \"$SOURCE_FRAMEWORK\" \"$TARGET_FRAMEWORK\"\n    echo \"Framework copied successfully\"\nelse\n    echo \"Error: Source framework not found at $SOURCE_FRAMEWORK\"\n    exit 1\nfi\n\n# Copy Compose resources to iOS app bundle\nRESOURCE_SOURCE=\"$PWD/kmm/build/generated/compose/resourceGenerator/preparedResources/commonMain/composeResources\"\nRESOURCE_DEST=\"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/compose-resources/composeResources/chuckstaplist.kmm.generated.resources\"\n\necho \"Copying resources from: $RESOURCE_SOURCE\"\necho \"Copying resources to: $RESOURCE_DEST\"\n\nif [ -d \"$RESOURCE_SOURCE\" ]; then\n    mkdir -p \"$RESOURCE_DEST\"\n    cp -R \"$RESOURCE_SOURCE/\"* \"$RESOURCE_DEST/\"\n    echo \"Resources copied successfully\"\nelse\n    echo \"Warning: Resource source directory not found: $RESOURCE_SOURCE\"\nfi\n";
		};
